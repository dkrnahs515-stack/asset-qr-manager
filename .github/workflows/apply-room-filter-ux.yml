name: apply-room-filter-ux

on:
  push:
    branches:
      - feature/inventory-mobile-mvp
    paths:
      - .github/workflows/apply-room-filter-ux.yml
      - scripts/apply-room-filter-ux.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/inventory-mobile-mvp
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply approved UX patch
        run: python3 scripts/apply-room-filter-ux.py
      - name: Verify tests
        run: npm test
      - name: Commit implementation and remove one-time patch files
        run: |
          rm scripts/apply-room-filter-ux.py
          rm .github/workflows/apply-room-filter-ux.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/Index.html tests/room-filter-ux.test.js scripts/apply-room-filter-ux.py .github/workflows/apply-room-filter-ux.yml
          git commit -m "feat: improve completed item discovery"
          git push origin HEAD:feature/inventory-mobile-mvp
