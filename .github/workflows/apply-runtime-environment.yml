name: apply-runtime-environment

on:
  push:
    branches:
      - feature/apps-script-runtime-environments

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runtime environment branch
        uses: actions/checkout@v4
        with:
          ref: feature/apps-script-runtime-environments
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply runtime integration patch
        run: python .github/scripts/apply_runtime_environment_patch.py

      - name: Run full test suite
        run: npm test

      - name: Commit integrated runtime files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/Code.gs apps-script/FieldOps.gs apps-script/Index.html apps-script/README.md tests/syntax.test.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No runtime integration changes required."
            exit 0
          fi
          git commit -m "feat: integrate Script Property runtime selection"
          git push origin HEAD:feature/apps-script-runtime-environments
