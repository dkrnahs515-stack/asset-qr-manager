name: inventory-mvp-ci

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
      - feature/inventory-mobile-mvp

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'push' && github.ref_name == 'feature/asset-current-state'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current-state branch
        uses: actions/checkout@v4
        with:
          ref: feature/asset-current-state
          fetch-depth: 0
      - name: Apply repeated-session patches
        run: python .github/scripts/apply_repeated_session.py
      - name: Commit production changes when needed
        shell: bash
        run: |
          if git diff --quiet -- apps-script/Code.gs apps-script/Index.html; then
            echo "No repeated-session patch changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/Code.gs apps-script/Index.html
          git diff --cached --check
          git commit -m "feat: start repeated inspections from current locations"
          git push origin HEAD:feature/asset-current-state

  test:
    needs: patch
    if: always() && (github.event_name == 'pull_request' || needs.patch.result == 'success' || needs.patch.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest current-state branch after patch
        if: github.event_name == 'push' && github.ref_name == 'feature/asset-current-state'
        uses: actions/checkout@v4
        with:
          ref: feature/asset-current-state
      - name: Checkout event revision
        if: github.event_name != 'push' || github.ref_name != 'feature/asset-current-state'
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests
        run: npm test
