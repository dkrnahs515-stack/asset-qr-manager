name: inventory-mvp-ci

on:
  push:
    branches:
      - main
      - feature/inventory-mobile-mvp
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: inventory-mvp-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.event_name == 'push' && github.ref_name == 'feature/inventory-mobile-mvp' && contains(github.event.head_commit.message, 'chore: run asset number audit patch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/inventory-mobile-mvp
          fetch-depth: 0
      - name: Apply asset-number and audit patch
        run: python .github/scripts/apply_asset_number_audit.py
      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/Core.js apps-script/Code.gs apps-script/Inspection.gs
          git diff --cached --check
          git commit -m "fix: normalize asset numbers and validate audit logs"
          git push origin HEAD:feature/inventory-mobile-mvp

  test:
    needs: patch
    if: always() && (github.event_name == 'pull_request' || needs.patch.result == 'success' || needs.patch.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest feature branch
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Checkout pull request merge
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests
        run: npm test
