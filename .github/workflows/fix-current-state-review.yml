name: fix-current-state-review

on:
  push:
    branches:
      - feature/asset-current-state

permissions:
  contents: write

concurrency:
  group: fix-current-state-review
  cancel-in-progress: false

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current-state branch
        uses: actions/checkout@v4
        with:
          ref: feature/asset-current-state
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply reviewed current-state fixes
        run: python .github/scripts/fix_current_state_review_findings.py

      - name: Run full test suite
        run: npm test

      - name: Commit production fixes when needed
        shell: bash
        run: |
          if git diff --quiet -- apps-script/CurrentStateCore.js apps-script/CurrentState.gs apps-script/Code.gs; then
            echo "No production fixes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/CurrentStateCore.js apps-script/CurrentState.gs apps-script/Code.gs
          git diff --cached --check
          git commit -m "fix: harden current-state reconstruction"
          git push origin HEAD:feature/asset-current-state
