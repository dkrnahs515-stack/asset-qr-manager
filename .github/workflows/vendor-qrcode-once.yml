name: vendor-qrcode-once

on:
  push:
    branches:
      - feature/asset-label-print-pilot

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/asset-label-print-pilot
          fetch-depth: 0

      - name: Vendor pinned qrcode-generator 1.4.4
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f apps-script/QrVendor.html ]]; then
            echo 'QrVendor.html already exists; nothing to do.'
            exit 0
          fi

          url='https://raw.githubusercontent.com/cdnjs/cdnjs/0110e53fc859fa69ece0c0ff482fff286a4586fc/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js'
          curl --fail --silent --show-error --location "$url" -o /tmp/qrcode.min.js

          expected_blob='1434c6f71294359da45941262d7edbbebfb73ffc'
          actual_blob="$(git hash-object /tmp/qrcode.min.js)"
          if [[ "$actual_blob" != "$expected_blob" ]]; then
            echo "Unexpected QR vendor blob: $actual_blob" >&2
            exit 1
          fi

          {
            echo '<!-- qrcode-generator 1.4.4 | Copyright (c) 2009 Kazuhiko Arase | MIT License -->'
            echo '<script>'
            cat /tmp/qrcode.min.js
            echo
            echo '</script>'
          } > apps-script/QrVendor.html

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/QrVendor.html
          git commit -m 'build: vendor qrcode-generator 1.4.4'
          git push origin HEAD:feature/asset-label-print-pilot
