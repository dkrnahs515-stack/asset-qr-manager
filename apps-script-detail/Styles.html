<style>
  :root{
    color-scheme:light;
    --bg:#f4f7f6;
    --surface:#ffffff;
    --text:#18201d;
    --muted:#66736d;
    --line:#d9e2de;
    --brand:#0f6b55;
    --brand-soft:#e7f5ef;
    --warn:#9a5a00;
    --warn-soft:#fff4db;
    --danger:#a4262c;
    --danger-soft:#fdebec;
    --shadow:0 10px 30px rgba(24,32,29,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif}
  body{font-size:16px;line-height:1.55}
  button{font:inherit}
  .shell{width:min(720px,100%);margin:0 auto;padding:18px 14px 44px}
  .runtime{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:13px}
  .runtime.test{background:#fff7ed;border-color:#fdba74;color:#9a3412}
  .runtime.production{background:#ecfdf3;border-color:#86efac;color:#166534}
  .runtime strong{white-space:nowrap}
  .runtime span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
  .hero{padding:22px 20px;border-radius:22px;background:linear-gradient(145deg,#0f6b55,#164e3f);color:#fff;box-shadow:var(--shadow)}
  .hero p{margin:0 0 8px;font-size:13px;font-weight:700;opacity:.86}
  .hero h1{margin:0;font-size:28px;line-height:1.2;letter-spacing:-.02em;word-break:break-all}
  .hero h2{margin:8px 0 0;font-size:20px;line-height:1.3;font-weight:750}
  .card,.state-card{margin-top:14px;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
  .card h3{margin:0 0 14px;font-size:18px}
  .state-card{text-align:center;padding:34px 20px}
  .state-card h1{margin:0 0 10px;font-size:21px}
  .state-card p{margin:0;color:var(--muted)}
  .loading-dot{width:32px;height:32px;margin:0 auto 14px;border:4px solid #dce7e2;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .info-list{margin:0;display:grid;grid-template-columns:minmax(98px,130px) 1fr;gap:0}
  .info-list dt,.info-list dd{margin:0;padding:11px 0;border-bottom:1px solid #edf1ef}
  .info-list dt{color:var(--muted);font-size:14px;font-weight:700}
  .info-list dd{font-weight:700;word-break:break-word}
  .info-list dt:last-of-type,.info-list dd:last-of-type{border-bottom:0}
  .location-grid{display:grid;gap:10px}
  .location-box{padding:14px;border:1px solid var(--line);border-radius:14px;background:#f9fbfa}
  .location-box.current{border-color:#9fd5c2;background:var(--brand-soft)}
  .location-box.registered.mismatch{border-color:#f4c574;background:#fffaf0}
  .location-label{display:block;margin-bottom:4px;color:var(--muted);font-size:13px;font-weight:800}
  .location-value{font-size:17px;font-weight:800;word-break:break-word}
  .meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .badge{display:inline-flex;align-items:center;min-height:30px;padding:4px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:13px;font-weight:800}
  .badge.warn{background:var(--warn-soft);color:var(--warn)}
  .badge.danger{background:var(--danger-soft);color:var(--danger)}
  .warning{margin-top:12px;padding:12px;border-radius:12px;background:var(--warn-soft);color:#7a4600;font-weight:750}
  .latest-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .latest-item{padding:12px;border:1px solid var(--line);border-radius:13px;background:#fbfcfc}
  .latest-item span{display:block;color:var(--muted);font-size:13px;font-weight:700}
  .latest-item strong{display:block;margin-top:4px;word-break:break-word}
  .history-list{display:grid;gap:10px}
  .history-item{border:1px solid var(--line);border-radius:14px;background:#fbfcfc;overflow:hidden}
  .history-item summary{cursor:pointer;list-style:none;padding:13px 14px;font-weight:800}
  .history-item summary::-webkit-details-marker{display:none}
  .history-item summary::after{content:"＋";float:right;color:var(--muted)}
  .history-item[open] summary::after{content:"－"}
  .history-body{padding:0 14px 14px;color:var(--muted);font-size:14px}
  .history-body p{margin:5px 0}
  .more{width:100%;min-height:50px;margin-top:12px;border:0;border-radius:14px;background:var(--brand);color:#fff;font-weight:850;cursor:pointer}
  .more:disabled{opacity:.55;cursor:wait}
  .empty{padding:22px 8px;text-align:center;color:var(--muted)}
  [hidden]{display:none!important}
  @media(max-width:480px){
    .shell{padding:12px 10px 34px}
    .hero{padding:19px 17px;border-radius:18px}
    .hero h1{font-size:24px}
    .card,.state-card{padding:16px;border-radius:16px}
    .info-list{grid-template-columns:105px 1fr}
    .latest-grid{grid-template-columns:1fr}
  }
</style>
