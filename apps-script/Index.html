<!doctype html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="theme-color" content="#f8fafc">
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
  <style>
    :root{--bg:#f4f6f8;--surface:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--green:#166534;--greenSoft:#dcfce7;--amber:#b45309;--amberSoft:#fef3c7;--red:#b42318;--redSoft:#fee4e2;--blue:#175cd3;--blueSoft:#dbeafe;--shadow:0 12px 32px rgba(15,23,42,.10);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{overscroll-behavior-y:none}button,input,select,textarea{font:inherit}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
    .app{width:100%;max-width:600px;min-height:100vh;margin:0 auto;background:var(--bg);padding-bottom:calc(86px + env(safe-area-inset-bottom))}
    .topbar{position:sticky;top:0;z-index:40;min-height:64px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(248,250,252,.96);backdrop-filter:blur(14px);border-bottom:1px solid rgba(228,231,236,.95);display:flex;align-items:center;gap:10px}
    .back{border:1px solid var(--line);background:var(--surface);width:44px;height:44px;border-radius:14px;font-size:20px;flex:0 0 auto}.head-copy{min-width:0;flex:1}.eyebrow{font-size:12px;color:var(--muted);margin-bottom:2px}.title{font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.online{border-radius:999px;padding:7px 9px;font-size:11px;font-weight:900;background:var(--greenSoft);color:var(--green)}.online.off{background:var(--redSoft);color:var(--red)}
    main{padding:14px}.stack{display:grid;gap:12px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(15,23,42,.035)}.section-title{font-size:16px;font-weight:900;margin:2px 0}.help{font-size:13px;color:var(--muted);line-height:1.5;margin:5px 0 12px}.notice{border-radius:14px;background:var(--amberSoft);color:#7a2e0e;padding:11px 13px;font-size:13px;line-height:1.45}.error{margin:12px 14px 0;border-radius:14px;background:var(--redSoft);color:#912018;padding:11px 13px;font-size:13px}
    .progress-card{padding:18px}.progress-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}.progress-value{font-size:34px;font-weight:950;letter-spacing:-1px}.progress-meta{text-align:right;color:var(--muted);font-size:13px}.track{height:10px;background:#eaecf0;border-radius:999px;overflow:hidden;margin-top:13px}.fill{height:100%;background:var(--green);border-radius:999px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px}.stat small{color:var(--muted)}.stat b{display:block;font-size:21px;margin-top:3px}
    .btn{border:0;border-radius:16px;min-height:54px;padding:0 16px;font-weight:900;width:100%}.btn.primary{background:var(--text);color:#fff}.btn.green{background:var(--green);color:#fff;min-height:62px;font-size:17px}.btn.soft{background:var(--surface);border:1px solid var(--line);color:var(--text)}.btn.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}.btn.danger{background:var(--redSoft);color:var(--red)}.btn.blue{background:var(--blueSoft);color:var(--blue)}
    .field{display:grid;gap:7px}.field label{font-size:13px;font-weight:850}.input,.select,.textarea{width:100%;border:1px solid #d0d5dd;background:#fff;border-radius:14px;padding:12px 13px;color:var(--text);outline:none}.input,.select{min-height:50px}.textarea{min-height:92px;resize:vertical}.input:focus,.select:focus,.textarea:focus{border-color:#98a2b3;box-shadow:0 0 0 3px rgba(152,162,179,.15)}
    .floor-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.floor-card{min-height:126px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:15px;color:var(--text)}.floor-card.review{background:#fffbeb;border-color:#fbbf24}.floor-name{font-size:17px;font-weight:900}.floor-percent{font-size:24px;font-weight:950;margin-top:13px}.floor-meta{font-size:12px;color:var(--muted);margin-top:3px}
    .next-room{display:flex;gap:10px;align-items:center;border:1px solid #bbf7d0;background:#f0fdf4;border-radius:16px;padding:13px 14px;margin-bottom:12px}.next-room-copy{flex:1}.next-room b{display:block}.next-room small{color:var(--muted)}.next-room button{border:0;background:var(--green);color:#fff;border-radius:12px;min-height:42px;padding:0 13px;font-weight:900}
    .location-card,.asset-card{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:17px;padding:15px;color:var(--text)}.location-card.done{opacity:.72}.row-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.name{font-weight:900;line-height:1.35}.meta{font-size:12px;color:var(--muted);line-height:1.5;margin-top:5px}.mini{height:7px;background:#eaecf0;border-radius:999px;overflow:hidden;margin-top:11px}.mini span{display:block;height:100%;background:var(--green);border-radius:999px}
    .badge{display:inline-flex;align-items:center;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900;white-space:nowrap}.pending{background:var(--amberSoft);color:var(--amber)}.ok{background:var(--greenSoft);color:var(--green)}.issue{background:var(--redSoft);color:var(--red)}.review{background:var(--blueSoft);color:var(--blue)}.temp{background:#ede9fe;color:#6d28d9}
    .room-summary{position:sticky;top:64px;z-index:25;background:rgba(244,246,248,.97);padding:10px 14px 8px;margin:-14px -14px 0;border-bottom:1px solid var(--line)}.room-summary-inner{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:13px}.room-stats{display:flex;justify-content:space-between;align-items:center;gap:10px}.room-stats strong{font-size:20px}.room-stats small{color:var(--muted)}.closed-pill{background:var(--greenSoft);color:var(--green);font-size:11px;font-weight:900;border-radius:999px;padding:6px 8px}
    .search{position:relative}.search input{padding-left:40px}.search span{position:absolute;left:14px;top:14px;color:var(--muted)}.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:850;white-space:nowrap}.chip.active{background:var(--text);border-color:var(--text);color:#fff}
    .room-actions{position:fixed;z-index:45;left:50%;bottom:calc(66px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(600px,100%);padding:8px 12px;background:linear-gradient(to top,rgba(244,246,248,1) 65%,rgba(244,246,248,0));display:grid;grid-template-columns:1.25fr .9fr;gap:8px}.room-actions button{min-height:54px;border-radius:15px;border:1px solid var(--line);font-weight:900}.room-actions .add{background:var(--text);color:#fff;border-color:var(--text)}.room-actions .close-room{background:#fff;color:var(--text)}
    .bottom-nav{position:fixed;z-index:44;left:50%;bottom:0;transform:translateX(-50%);width:min(600px,100%);background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:3px}.nav{border:0;background:transparent;border-radius:11px;min-height:52px;color:var(--muted);font-size:11px;font-weight:850;display:grid;place-items:center;gap:1px}.nav span{font-size:20px}.nav.active{background:#f2f4f7;color:var(--text)}
    .overlay{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center}.modal{width:min(600px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}.grab{width:44px;height:5px;background:#d0d5dd;border-radius:999px;margin:2px auto 15px}.modal h2{font-size:21px;margin:0 0 4px}.modal-sub{color:var(--muted);font-size:13px;margin-bottom:14px}.detail-grid{border-top:1px solid var(--line);margin:14px 0}.detail-row{display:grid;grid-template-columns:95px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}.detail-row span:first-child{color:var(--muted)}.action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:9px}.action-grid button{min-height:56px;border-radius:15px;border:1px solid var(--line);background:#fff;font-weight:900}.action-grid .loc{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}.action-grid .problem{background:#fff7ed;color:#b45309;border-color:#fed7aa}.action-grid .missing{background:#fef2f2;color:#b91c1c;border-color:#fecaca}.action-grid .photo{background:#f5f3ff;color:#6d28d9;border-color:#ddd6fe}
    .issue-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.issue-choice{min-height:48px;border:1px solid var(--line);background:#fff;border-radius:13px;font-weight:800}.issue-choice.active{background:var(--text);color:#fff;border-color:var(--text)}
    .photo-preview{width:100%;max-height:260px;object-fit:contain;background:#f2f4f7;border-radius:14px;border:1px solid var(--line);margin-top:8px}.file-box{position:relative;border:1px dashed #98a2b3;border-radius:15px;background:#f9fafb;padding:16px;text-align:center;font-weight:850;color:#344054}.file-box input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}.photo-help{font-size:12px;color:var(--muted);margin-top:6px}
    .closeout-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.closeout-stat{border:1px solid var(--line);border-radius:13px;padding:10px;text-align:center}.closeout-stat b{font-size:18px;display:block}.closeout-stat small{font-size:11px;color:var(--muted)}
    .undo{position:fixed;z-index:110;left:50%;bottom:calc(132px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(568px,calc(100% - 24px));background:#111827;color:#fff;border-radius:16px;padding:11px 12px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}.undo-copy{flex:1;min-width:0;font-size:12px}.undo-copy strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.undo button{border:0;border-radius:11px;min-height:40px;padding:0 12px;background:#fff;color:#111827;font-weight:900}.toast{position:fixed;z-index:130;left:50%;bottom:calc(138px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 28px);background:#111827;color:#fff;border-radius:14px;padding:11px 15px;font-size:13px;font-weight:850;box-shadow:var(--shadow)}
    .spinner{width:26px;height:26px;border:3px solid #d0d5dd;border-top-color:var(--text);border-radius:50%;animation:spin .7s linear infinite;margin:28px auto}.empty{text-align:center;color:var(--muted);padding:34px 14px}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:380px){.action-grid{grid-template-columns:1fr}.floor-grid{gap:8px}.room-actions{grid-template-columns:1fr 1fr}.title{font-size:16px}}
  </style>
</head>
<body>
<div id="root"></div>
<script>
const html=htm.bind(React.createElement);
const{useEffect,useMemo,useRef,useState}=React;

const api={
  call(name,...args){return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args)})},
  getBootstrapData(){return this.call('getBootstrapData')},
  startInventorySession(inspector){return this.call('startInventorySession',inspector)},
  getLocationsForFloor(sessionId,floor){return this.call('getLocationsForFloor',sessionId,floor)},
  getRoomInventoryData(sessionId,locationCode){return this.call('getRoomInventoryData',sessionId,locationCode)},
  getSelectableLocations(){return this.call('getSelectableLocations')},
  applyInspectionAction(payload){return this.call('applyInspectionActionFromMobile',payload)},
  reviseInspectionAction(payload){return this.call('reviseInspectionActionFromMobile',payload)},
  undoInspectionAction(payload){return this.call('undoInspectionAction',payload)},
  registerUnregisteredAsset(payload){return this.call('registerUnregisteredAsset',payload)},
  uploadInventoryPhoto(payload){return this.call('uploadInventoryPhoto',payload)},
  closeLocationInspection(payload){return this.call('closeLocationInspection',payload)}
};

function uuid(){return crypto&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(16).slice(2)}
function errText(e){return e&&e.message?e.message:String(e||'알 수 없는 오류가 발생했습니다.')}
function badgeFor(item){if(item.displayRole==='inbound')return[`유입 · ${item.result||'확인'}`,'review'];if(item.targetType==='미등록비품')return['미등록','temp'];if(item.result==='정상')return['정상','ok'];if(item.result==='미확인')return['미확인','pending'];if(item.result==='보류')return['보류','review'];return[item.result||'확인필요','issue']}
function pct(completed,total){return total?Math.round(completed/total*10000)/100:0}
function sortLocationCards(list){return [...(list||[])].sort((a,b)=>{const ad=a.unconfirmed>0?0:1,bd=b.unconfirmed>0?0:1;if(ad!==bd)return ad-bd;return Number(a.sortOrder||9999)-Number(b.sortOrder||9999)||String(a.spaceName||'').localeCompare(String(b.spaceName||''),'ko')})}
function roomDelta(summary,from,to){const s={...(summary||{})};const completed=x=>['정상','위치변경','상태이상','미발견','보류'].includes(x);if(completed(from)!==completed(to))s.completed=Math.max(0,(s.completed||0)+(completed(to)?1:-1));if(from==='미확인')s.unconfirmed=Math.max(0,(s.unconfirmed||0)-1);if(to==='미확인')s.unconfirmed=(s.unconfirmed||0)+1;for(const [key,val]of[['normal','정상'],['locationChanged','위치변경'],['issue','상태이상'],['missing','미발견']]){if(from===val)s[key]=Math.max(0,(s[key]||0)-1);if(to===val)s[key]=(s[key]||0)+1}return s}

async function compressImage(file){
  if(!file)throw new Error('사진을 선택하세요.');
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((resolve,reject)=>{const x=new Image();x.onload=()=>resolve(x);x.onerror=()=>reject(new Error('사진을 읽을 수 없습니다. 다른 사진을 선택하세요.'));x.src=url});
    const max=1600,scale=Math.min(1,max/Math.max(img.naturalWidth||1,img.naturalHeight||1));
    const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    const dataUrl=canvas.toDataURL('image/jpeg',.78);
    return{base64:dataUrl.split(',')[1],mimeType:'image/jpeg',clientPhotoUuid:uuid(),preview:dataUrl};
  }finally{URL.revokeObjectURL(url)}
}

function Header({view,title,subtitle,onBack,online}){return html`<header className="topbar">${view!=='home'?html`<button className="back" onClick=${onBack} aria-label="뒤로">←</button>`:null}<div className="head-copy"><div className="eyebrow">${subtitle||'강서청소년회관'}</div><div className="title">${title}</div></div><div className=${'online'+(online?'':' off')}>${online?'● 온라인':'● 오프라인'}</div></header>`}
function Progress({summary}){if(!summary)return null;return html`<section className="card progress-card"><div className="progress-head"><div><div className="eyebrow">전체 전수조사 진행률</div><div className="progress-value">${Number(summary.progress||0).toFixed(1)}%</div></div><div className="progress-meta"><b>${summary.completed||0} / ${summary.total||0}</b><br/>미확인 ${summary.unconfirmed||0}개</div></div><div className="track"><div className="fill" style=${{width:`${Math.min(100,summary.progress||0)}%`}}></div></div></section>`}

function Home({bootstrap,inspector,setInspector,onStart,onContinue,busy}){const s=bootstrap?.summary,session=bootstrap?.activeSession;return html`<main className="stack">${session?html`<${Progress} summary=${s}/><div className="stats"><div className="stat"><small>정상</small><b>${s.normal}</b></div><div className="stat"><small>위치변경</small><b>${s.locationChanged}</b></div><div className="stat"><small>상태이상</small><b>${s.issue}</b></div><div className="stat"><small>미발견</small><b>${s.missing}</b></div></div><section className="card"><div className="eyebrow">진행 중인 세션</div><div className="section-title">${session.name}</div><p className="help">${session.sessionId} · 기준 ${session.baselineCount}개 · 미등록 발견 ${s.unregisteredFound||0}개</p><div className="field"><label>현재 조사자 *</label><input className="input" value=${inspector} onInput=${e=>setInspector(e.target.value)} placeholder="실제 조사자 이름 입력"/></div><p className="help">세션 생성자: ${session.creator||'-'} · 입력한 이름이 이후 조사기록과 사진 이력에 저장됩니다.</p><button className="btn primary" disabled=${busy||!inspector.trim()} onClick=${onContinue}>▶ 현장조사 이어하기</button></section>`:html`<section className="card"><div className="section-title">새 전수조사 시작</div><p className="help">현재 비품마스터 전체를 미확인 상태로 스냅샷 생성합니다.</p><div className="field"><label>조사자 이름</label><input className="input" value=${inspector} onInput=${e=>setInspector(e.target.value)} placeholder="예: 이건희"/></div><div style=${{height:'12px'}}></div><button className="btn primary" disabled=${busy||!inspector.trim()} onClick=${onStart}>${busy?'생성 중…':'전수조사 시작'}</button></section>`}</main>`}

function Floors({bootstrap,onSelect}){return html`<main><div className="section-title">조사할 층을 선택하세요</div><p className="help">미확인이 남은 층부터 진행하면 현장 동선이 단순해집니다.</p><div className="floor-grid">${(bootstrap?.floors||[]).map(f=>html`<button className="floor-card" key=${f.floor} onClick=${()=>onSelect(f.floor)}><div className="floor-name">${f.floor}</div><div className="floor-percent">${Number(f.progress||0).toFixed(0)}%</div><div className="floor-meta">${f.completed}/${f.total} · 미확인 ${f.unconfirmed}</div></button>`)}${bootstrap?.reviewLocations>0?html`<button className="floor-card review" onClick=${()=>onSelect('__REVIEW__')}><div className="floor-name">⚠ 위치 확인 필요</div><div className="floor-percent">${bootstrap.reviewLocations}</div><div className="floor-meta">검토 위치 그룹</div></button>`:null}</div></main>`}

function Locations({locations,loading,onSelect}){const sorted=sortLocationCards(locations),next=sorted.find(x=>x.unconfirmed>0);return html`<main>${next?html`<div className="next-room"><div className="next-room-copy"><b>다음 미완료 공간</b><small>${next.spaceName} · 미확인 ${next.unconfirmed}개</small></div><button onClick=${()=>onSelect(next)}>이동 →</button></div>`:null}<div className="section-title">공간 선택</div><p className="help">미완료 공간을 먼저, 완료 공간은 아래로 정렬했습니다.</p>${loading?html`<div className="spinner"></div>`:html`<div className="stack">${sorted.map(l=>html`<button key=${l.locationCode} className=${'location-card'+(l.unconfirmed===0?' done':'')} onClick=${()=>onSelect(l)}><div className="row-head"><div><div className="name">${l.spaceName}</div><div className="meta">${l.floor} · ${l.completed}/${l.total} 완료 · 미확인 ${l.unconfirmed}</div></div><span className=${'badge '+(l.unconfirmed?'pending':'ok')}>${l.unconfirmed?'진행중':'완료'}</span></div><div className="mini"><span style=${{width:`${l.progress||0}%`}}></span></div></button>`)}${!sorted.length?html`<div className="empty">해당 층에 조사 공간이 없습니다.</div>`:null}</div>`}</main>`}

function Room({roomData,loading,filter,setFilter,search,setSearch,onSelect,onAdd,onCloseRoom,searchRef}){
  const items=roomData?.assets||[],summary=roomData?.summary||{};
  const counts=useMemo(()=>({pending:items.filter(x=>x.displayRole!=='inbound'&&x.result==='미확인').length,issues:items.filter(x=>x.displayRole!=='inbound'&&['위치변경','상태이상','미발견'].includes(x.result)).length,unregistered:items.filter(x=>x.targetType==='미등록비품').length,inbound:items.filter(x=>x.displayRole==='inbound').length,completed:items.filter(x=>x.displayRole!=='inbound'&&x.targetType!=='미등록비품'&&x.result!=='미확인').length}),[items]);

  async function selectLocation(location){setSelectedLocation(location);setLoading(true);setView('assets');setRoomData(null);setFilter('pending');setSearch('');setError('');try{setRoomData(await api.getRoomInventoryData(bootstrap.activeSession.sessionId,location.locationCode))}catch(e){setError(errText(e))}finally{setLoading(false)}}
  function applyLocalResult(updated,from){setRoomData(current=>current?{...current,assets:current.assets.map(x=>x.recordId===updated.recordId?updated:x),summary:roomDelta(current.summary,from,updated.result)}:current);const delta=from==='미확인'&&updated.result!=='미확인'?1:from!=='미확인'&&updated.result==='미확인'?-1:0;if(delta){setLocations(current=>current.map(l=>l.locationCode===selectedLocation.locationCode?{...l,completed:Math.max(0,l.completed+delta),unconfirmed:Math.max(0,l.unconfirmed-delta),progress:pct(Math.max(0,l.completed+delta),l.total)}:l));setBootstrap(current=>current?{...current,floors:current.floors.map(f=>f.floor===selectedLocation.floor?{...f,completed:Math.max(0,f.completed+delta),unconfirmed:Math.max(0,f.unconfirmed-delta),progress:pct(Math.max(0,f.completed+delta),f.total)}:f)}:current)}}
  async function submitInspection(action){if(!selectedAsset)return;const from=selectedAsset.result;setBusy(true);setError('');try{const res=await api.applyInspectionAction({sessionId:bootstrap.activeSession.sessionId,recordId:selectedAsset.recordId,inspector:inspector.trim(),actionUuid:uuid(),...action});applyLocalResult(res.record,from);setBootstrap(x=>({...x,summary:res.summary}));setLastUndo({recordId:res.record.recordId,changeId:res.changeId,name:res.record.name,toResult:res.record.result,floor:selectedLocation.floor,locationCode:selectedLocation.locationCode});setSelectedAsset(null);setForm(null);setToast(`${res.record.name} · ${res.record.result} 저장`)}catch(e){setError(errText(e))}finally{setBusy(false)}}
  async function submitRevision(action){if(!selectedAsset||!selectedLocation)return;const from=selectedAsset.result;setBusy(true);setError('');try{const res=await api.reviseInspectionAction({sessionId:bootstrap.activeSession.sessionId,recordId:selectedAsset.recordId,inspector:inspector.trim(),actionUuid:uuid(),...action});const[freshRoom,freshBootstrap]=await Promise.all([api.getRoomInventoryData(bootstrap.activeSession.sessionId,selectedLocation.locationCode),api.getBootstrapData()]);setRoomData(freshRoom);setBootstrap(freshBootstrap);setLastUndo({recordId:res.record.recordId,changeId:res.changeId,name:res.record.name,toResult:res.record.result,fromResult:from,floor:selectedLocation.floor,locationCode:selectedLocation.locationCode});setSelectedAsset(null);setForm(null);setToast(`${res.record.name} · ${from} → ${res.record.result} 수정`)}catch(e){setError(errText(e))}finally{setBusy(false)}}
  async function undoLast(){if(!lastUndo)return;setBusy(true);try{const res=await api.undoInspectionAction({sessionId:bootstrap.activeSession.sessionId,recordId:lastUndo.recordId,changeId:lastUndo.changeId,inspector:inspector.trim(),actionUuid:uuid()});const freshBootstrap=await api.getBootstrapData();setBootstrap(freshBootstrap);if(selectedLocation){setRoomData(await api.getRoomInventoryData(bootstrap.activeSession.sessionId,selectedLocation.locationCode))}setLastUndo(null);setToast(`${res.record.name} 작업 취소 완료`)}catch(e){setError(errText(e));setLastUndo(null)}finally{setBusy(false)}}
  async function addUnregistered(data){setBusy(true);try{const res=await api.registerUnregisteredAsset({sessionId:bootstrap.activeSession.sessionId,locationCode:selectedLocation.locationCode,inspector:inspector.trim(),actionUuid:uuid(),name:data.name,spec:data.spec,memo:data.memo,photo:data.photo});setRoomData(current=>({...current,assets:[...current.assets,res.record],summary:{...current.summary,unregisteredFound:(current.summary.unregisteredFound||0)+1}}));setBootstrap(x=>({...x,summary:res.summary}));setForm(null);setFilter('unregistered');setToast(`${res.record.tempAssetId} 미등록 비품 저장`)}catch(e){setError(errText(e))}finally{setBusy(false)}}
  async function addPhoto(data){setBusy(true);try{const res=await api.uploadInventoryPhoto({sessionId:bootstrap.activeSession.sessionId,recordId:selectedAsset.recordId,inspector:inspector.trim(),actionUuid:uuid(),photoType:data.photoType,memo:data.memo,photo:data.photo});setRoomData(current=>({...current,assets:current.assets.map(x=>x.recordId===res.record.recordId?res.record:x)}));setSelectedAsset(res.record);setLastUndo(null);setForm(null);setToast(`사진 저장 완료 · ${res.record.photoCount}장`)}catch(e){setError(errText(e))}finally{setBusy(false)}}
  async function closeRoom(allowIncomplete){setBusy(true);try{const res=await api.closeLocationInspection({sessionId:bootstrap.activeSession.sessionId,locationCode:selectedLocation.locationCode,inspector:inspector.trim(),actionUuid:uuid(),allowIncomplete});setRoomData(current=>({...current,closeout:res.closeout}));setForm(null);setToast('공간 마감 기록 완료')}catch(e){setError(errText(e))}finally{setBusy(false)}}
  function goBack(){setError('');if(form){setForm(null);return}if(selectedAsset){setSelectedAsset(null);return}if(view==='assets')setView('locations');else if(view==='locations')setView('floors');else if(view==='floors')setView('home')}
  const title=view==='home'?'비품 전수조사':view==='floors'?'층 선택':view==='locations'?(selectedFloor==='__REVIEW__'?'위치 확인 필요':selectedFloor):(selectedLocation?.spaceName||'비품 목록');
  if(loading&&!bootstrap)return html`<div className="app"><${Header} view="home" title="비품 전수조사" online=${online}/><div className="spinner"></div></div>`;
  return html`<div className="app"><${Header} view=${view} title=${title} subtitle=${bootstrap?.activeSession?.sessionId||'강서청소년회관'} onBack=${goBack} online=${online}/>${error?html`<div className="error">${error}</div>`:null}${view==='home'?html`<${Home} bootstrap=${bootstrap} inspector=${inspector} setInspector=${setInspector} onStart=${startSession} onContinue=${()=>setView('floors')} busy=${busy}/>`:null}${view==='floors'?html`<${Floors} bootstrap=${bootstrap} onSelect=${selectFloor}/>`:null}${view==='locations'?html`<${Locations} locations=${locations} loading=${loading} onSelect=${selectLocation}/>`:null}${view==='assets'?html`<${Room} roomData=${roomData} loading=${loading} filter=${filter} setFilter=${setFilter} search=${search} setSearch=${setSearch} onSelect=${setSelectedAsset} onAdd=${()=>setForm('unregistered')} onCloseRoom=${()=>setForm('closeout')} searchRef=${searchRef}/>`:null}<${AssetDetail} asset=${selectedAsset} busy=${busy} onClose=${()=>setSelectedAsset(null)} onNormal=${()=>submitInspection({type:'정상확인'})} onOpenAction=${setForm} onPhoto=${()=>setForm('photo')} onRevise=${()=>setForm('revision')}/>${form==='위치변경'||form==='상태이상'||form==='미발견'?html`<${ActionModal} type=${form} asset=${selectedAsset} locations=${selectableLocations} currentLocation=${selectedLocation} busy=${busy} onClose=${()=>setForm(null)} onSubmit=${submitInspection}/>`:null}${form==='revision'&&selectedAsset?html`<${RevisionModal} asset=${selectedAsset} locations=${selectableLocations} busy=${busy} onClose=${()=>setForm(null)} onSubmit=${submitRevision}/>`:null}${form==='photo'&&selectedAsset?html`<${PhotoModal} asset=${selectedAsset} busy=${busy} onClose=${()=>setForm(null)} onSubmit=${addPhoto}/>`:null}${form==='unregistered'&&selectedLocation?html`<${UnregisteredModal} location=${selectedLocation} busy=${busy} onClose=${()=>setForm(null)} onSubmit=${addUnregistered}/>`:null}${form==='closeout'&&roomData?html`<${CloseoutModal} summary=${roomData.summary} closeout=${roomData.closeout} busy=${busy} onClose=${()=>setForm(null)} onCloseRoom=${closeRoom} onPending=${()=>{setFilter('pending');setForm(null)}}/>`:null}${bootstrap?.activeSession&&inspector.trim()?html`<${BottomNav} view=${view} onField=${()=>setView('floors')} onSearch=${()=>{setFilter('all');setTimeout(()=>searchRef.current?.focus(),50)}} onIssues=${()=>setFilter('issues')} onHome=${()=>setView('home')}/>`:null}${lastUndo?html`<div className="undo"><div className="undo-copy"><strong>${lastUndo.name}</strong>${lastUndo.toResult} 처리됨</div><button disabled=${busy} onClick=${undoLast}>↶ 취소</button><button onClick=${()=>setLastUndo(null)}>닫기</button></div>`:null}${toast?html`<div className="toast">${toast}</div>`:null}</div>`
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
