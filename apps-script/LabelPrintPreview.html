<!doctype html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QR 비품 라벨 미리보기</title>
  <?!= includeHtml_('QrVendor') ?>
  <style>
    :root{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
      color:#111827;
      background:#eef1f5;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#eef1f5;color:#111827}
    button{font:inherit;cursor:pointer}
    button:disabled{opacity:.5;cursor:wait}
    .screen-only{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.97);border-bottom:1px solid #d0d5dd;padding:12px 16px;box-shadow:0 2px 10px rgba(15,23,42,.08)}
    .toolbar{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .toolbar-copy{min-width:250px;flex:1}
    .toolbar-title{font-weight:900;font-size:17px}
    .toolbar-help{font-size:12px;color:#667085;margin-top:3px;line-height:1.45}
    .toolbar-actions{display:flex;gap:8px;flex-wrap:wrap}
    .toolbar button{border:1px solid #d0d5dd;background:#fff;border-radius:10px;min-height:42px;padding:0 14px;font-weight:850;color:#172033}
    .toolbar button.primary{background:#172033;color:#fff;border-color:#172033}
    .toolbar button.complete{background:#166534;color:#fff;border-color:#166534}
    .status{max-width:1100px;margin:8px auto 0;font-size:12px;line-height:1.5;min-height:18px}
    .status.error{color:#b42318}.status.ok{color:#166534}
    #preview-root{padding:18px 0 40px}
    .print-page{position:relative;width:210mm;height:297mm;margin:0 auto 18px;background:#fff;box-shadow:0 10px 32px rgba(15,23,42,.16);overflow:hidden;break-after:page;page-break-after:always}
    .print-page:last-child{break-after:auto;page-break-after:auto}
    .print-label{position:absolute;border:none;background:#fff;overflow:hidden;color:#000}
    .qr-box{position:absolute;left:2.1mm;top:3.9mm;display:flex;align-items:center;justify-content:center}
    .qr-box svg{display:block;width:100%;height:100%}
    .survey-date{position:absolute;left:2.1mm;top:24.9mm;width:20mm;text-align:center;white-space:nowrap;color:#000}
    .survey-date-title{font-size:5.4pt;font-weight:800;line-height:1.08}
    .survey-date-value{font-size:5.8pt;font-weight:800;line-height:1.08;margin-top:.65mm}
    .label-right{position:absolute;left:24.2mm;right:2mm;top:2.1mm;bottom:1.8mm;overflow:hidden}
    .label-title{position:absolute;left:0;top:0;font-size:5.7pt;font-weight:800;line-height:1.05;white-space:nowrap}
    .asset-no{position:absolute;left:0;right:0;top:4.6mm;font-size:9.3pt;font-weight:900;line-height:1.05;white-space:nowrap;overflow:hidden}
    .item-name{position:absolute;left:0;right:0;top:9.8mm;font-size:9.3pt;font-weight:900;line-height:1.05;white-space:nowrap;overflow:hidden}
    .light-divider{position:absolute;left:0;right:0;top:14.85mm;height:0;border-top:.2pt solid #bfc3c9}
    .manager-title{position:absolute;left:0;top:16.6mm;font-size:6.2pt;font-weight:800;line-height:1.05;white-space:nowrap}
    .manager-names{position:absolute;left:0;right:0;top:20.2mm;font-size:9pt;font-weight:900;line-height:1.05;white-space:nowrap;overflow:hidden}
    .test-marker{position:absolute;right:0;bottom:0;font-size:4.1pt;font-weight:800;color:#777;white-space:nowrap}
    @page { size: A4; margin: 0; }
    @media print{
      html,body{width:210mm;margin:0;padding:0;background:#fff}
      .screen-only{display:none !important}
      #preview-root{padding:0;margin:0}
      .print-page{width:210mm;height:297mm;margin:0;box-shadow:none;overflow:hidden}
      .print-label{border:none !important}
    }
  </style>
</head>
<body>
  <header class="screen-only">
    <div class="toolbar">
      <div class="toolbar-copy">
        <div id="toolbar-title" class="toolbar-title">라벨 미리보기 불러오는 중…</div>
        <div class="toolbar-help">Formtec LS3106 · 배율 100% · 실제 크기 · 여백 없음 · 머리글/바닥글 끄기</div>
      </div>
      <div class="toolbar-actions">
        <button id="print-btn" class="primary" disabled>인쇄 / PDF 저장</button>
        <button id="complete-btn" class="complete" disabled>출력 완료 반영</button>
        <button id="close-btn">닫기</button>
      </div>
    </div>
    <div id="status" class="status"></div>
  </header>

  <main id="preview-root"></main>

  <script>
    const PREVIEW_TOKEN = <?!= JSON.stringify(previewToken) ?>;

    const api={
      call(name,...args){
        return new Promise((resolve,reject)=>{
          google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args);
        });
      }
    };

    let currentModel=null;
    const root=document.getElementById('preview-root');
    const printButton=document.getElementById('print-btn');
    const completeButton=document.getElementById('complete-btn');
    const closeButton=document.getElementById('close-btn');
    const toolbarTitle=document.getElementById('toolbar-title');
    const status=document.getElementById('status');

    function setStatus(text,type=''){
      status.textContent=text||'';
      status.className='status'+(type?' '+type:'');
    }

    function mm(value){return `${Number(value)}mm`;}

    function createQrSvg(url){
      if(typeof qrcode!=='function') throw new Error('로컬 QR 생성기를 불러오지 못했습니다.');
      const qr=qrcode(0,'M');
      qr.addData(String(url||''),'Byte');
      qr.make();
      return qr.createSvgTag({cellSize:4,margin:16,scalable:true});
    }

    function fitSingleLineText(element,startPt=9.3,minPt=7.2){
      let size=startPt;
      element.style.fontSize=`${size.toFixed(1)}pt`;
      while(size>minPt && element.scrollWidth>element.clientWidth+0.5){
        size=Math.max(minPt,Math.round((size-0.1)*10)/10);
        element.style.fontSize=`${size.toFixed(1)}pt`;
      }
      return size;
    }

    function appendText(parent,className,text){
      const el=document.createElement('div');
      el.className=className;
      el.textContent=text==null?'':String(text);
      parent.appendChild(el);
      return el;
    }

    function renderLabel(pageElement,item,settings,environment){
      if(!item) return;
      const label=document.createElement('section');
      label.className='print-label';
      label.style.left=mm(item.slot.xMm);
      label.style.top=mm(item.slot.topMm);
      label.style.width=mm(settings.labelWidthMm);
      label.style.height=mm(settings.labelHeightMm);

      const qrBox=document.createElement('div');
      qrBox.className='qr-box';
      qrBox.style.width=mm(settings.qrSizeMm);
      qrBox.style.height=mm(settings.qrSizeMm);
      qrBox.innerHTML=createQrSvg(item.qrUrl);
      label.appendChild(qrBox);

      const survey=document.createElement('div');
      survey.className='survey-date';
      appendText(survey,'survey-date-title','조사 일자');
      appendText(survey,'survey-date-value',item.inspectionDate||'미조사');
      label.appendChild(survey);

      const right=document.createElement('div');
      right.className='label-right';
      appendText(right,'label-title',settings.labelTitle||'강서청소년회관 물품조사');
      const assetNo=appendText(right,'asset-no',item.newAssetNo);
      const itemName=appendText(right,'item-name',item.name);
      appendText(right,'light-divider','');
      appendText(right,'manager-title','관리책임자');
      appendText(right,'manager-names',`정 ${settings.primaryManager} · 부 ${settings.secondaryManager}`);
      if(environment==='TEST') appendText(right,'test-marker','TEST PILOT');
      label.appendChild(right);
      pageElement.appendChild(label);

      requestAnimationFrame(()=>{
        fitSingleLineText(assetNo,9.3,7.2);
        fitSingleLineText(itemName,9.3,7.2);
      });
    }

    function renderModel(model){
      currentModel=model;
      root.textContent='';
      toolbarTitle.textContent=`선택 ${model.itemCount}개 · ${model.pageCount}페이지 · Formtec LS3106`;
      const settings=model.printSettings;

      model.pages.forEach(page=>{
        const pageElement=document.createElement('div');
        pageElement.className='print-page';
        page.forEach(item=>renderLabel(pageElement,item,settings,model.environment));
        root.appendChild(pageElement);
      });

      printButton.disabled=false;
      completeButton.disabled=false;
      setStatus(`출력 배치 ${model.batchId} · 인쇄 후 실제 라벨을 확인한 다음에만 ‘출력 완료 반영’을 누르세요.`,'ok');
    }

    async function loadPreview(){
      try{
        const model=await api.call('getLabelPrintPreviewModel',PREVIEW_TOKEN);
        renderModel(model);
      }catch(error){
        toolbarTitle.textContent='라벨 미리보기를 열 수 없습니다.';
        setStatus(error?.message||String(error),'error');
      }
    }

    printButton.addEventListener('click',()=>window.print());

    completeButton.addEventListener('click',async()=>{
      if(!currentModel) return;
      if(!confirm('실물 라벨이 정상적으로 출력된 것을 확인했습니까?\n확인 후에만 출력 이력을 반영합니다.')) return;
      completeButton.disabled=true;
      setStatus('출력 완료 이력을 반영하는 중…');
      try{
        const result=await api.call('completeLabelPrintBatch',{token:PREVIEW_TOKEN});
        setStatus(`배치 ${result.batchId} · 반영 ${result.updated} · 이미 반영 ${result.skipped} · 실패 ${result.failed}`,result.failed?'error':'ok');
        if(!result.failed) completeButton.textContent='출력 완료 반영됨';
      }catch(error){
        setStatus(error?.message||String(error),'error');
        completeButton.disabled=false;
      }
    });

    closeButton.addEventListener('click',()=>window.close());
    loadPreview();
  </script>
</body>
</html>
